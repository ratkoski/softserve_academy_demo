<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/>
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <style>
    .box { fill:#ffffff; stroke:#4a4a4a; stroke-width:1.5; rx:8; }
    .zone { fill:#f4f6f9; stroke:#c5ccd6; stroke-width:1.2; rx:12; stroke-dasharray:6 4; }
    .bronze { fill:#f7e6d0; } .silver { fill:#e8ecf1; } .gold { fill:#fbf0c4; } .q { fill:#fde2e2; }
    .t { font-size:13px; fill:#222; } .h { font-size:14px; font-weight:bold; fill:#222; }
    .z { font-size:12px; fill:#6b7280; font-weight:bold; letter-spacing:.5px; }
    .s { font-size:11px; fill:#555; }
    .line { stroke:#4a4a4a; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
    .dash { stroke:#8a8a8a; stroke-width:1.3; fill:none; stroke-dasharray:5 4; marker-end:url(#arrowdash); }
  </style>

  <text x="700" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">OpenSky Platform — air traffic over Poland</text>

  <!-- Sources zone -->
  <rect class="zone" x="30" y="70" width="230" height="300"/>
  <text class="z" x="45" y="92">SOURCES</text>
  <rect class="box" x="45" y="105" width="200" height="60"/>
  <text class="h" x="145" y="130" text-anchor="middle">OpenSky API</text>
  <text class="s" x="145" y="150" text-anchor="middle">/states/all · OAuth2 · every 30 s</text>
  <rect class="box" x="45" y="190" width="200" height="60"/>
  <text class="h" x="145" y="215" text-anchor="middle">Aircraft registry</text>
  <text class="s" x="145" y="235" text-anchor="middle">OpenSky CSV · 520k rows</text>
  <rect class="box" x="45" y="275" width="200" height="60"/>
  <text class="h" x="145" y="300" text-anchor="middle">Airports</text>
  <text class="s" x="145" y="320" text-anchor="middle">OurAirports CSV</text>

  <!-- Producer zone -->
  <rect class="zone" x="300" y="70" width="200" height="110"/>
  <text class="z" x="315" y="92">OUTSIDE DATABRICKS</text>
  <rect class="box" x="315" y="105" width="170" height="60"/>
  <text class="h" x="400" y="130" text-anchor="middle">Producer</text>
  <text class="s" x="400" y="150" text-anchor="middle">Python · dev: files · prod: hub</text>

  <!-- Azure zone -->
  <rect class="zone" x="300" y="200" width="200" height="170"/>
  <text class="z" x="315" y="222">AZURE</text>
  <rect class="box" x="315" y="235" width="170" height="55"/>
  <text class="h" x="400" y="258" text-anchor="middle">Event Hubs</text>
  <text class="s" x="400" y="276" text-anchor="middle">Kafka endpoint · 1 h retention</text>
  <rect class="box" x="315" y="305" width="170" height="50"/>
  <text class="h" x="400" y="327" text-anchor="middle">Key Vault</text>
  <text class="s" x="400" y="344" text-anchor="middle">secrets → secret scope</text>

  <!-- UC Volume -->
  <rect class="box" x="315" y="400" width="170" height="50"/>
  <text class="h" x="400" y="422" text-anchor="middle">UC Volume</text>
  <text class="s" x="400" y="439" text-anchor="middle">landing/ positions · reference</text>

  <!-- Pipeline zone -->
  <rect class="zone" x="540" y="70" width="400" height="380"/>
  <text class="z" x="555" y="92">LAKEFLOW DECLARATIVE PIPELINE · expectations · AUTO CDC</text>
  <rect class="box bronze" x="555" y="110" width="150" height="48"/>
  <text class="t" x="630" y="139" text-anchor="middle">bronze_positions</text>
  <rect class="box bronze" x="555" y="245" width="150" height="48"/>
  <text class="t" x="630" y="274" text-anchor="middle">bronze_aircraft</text>
  <rect class="box bronze" x="555" y="380" width="150" height="48"/>
  <text class="t" x="630" y="409" text-anchor="middle">bronze_airports</text>

  <rect class="box silver" x="770" y="100" width="150" height="48"/>
  <text class="t" x="845" y="122" text-anchor="middle">silver_positions</text>
  <text class="s" x="845" y="139" text-anchor="middle">5 named quality rules</text>
  <rect class="box q" x="770" y="165" width="150" height="48"/>
  <text class="t" x="845" y="187" text-anchor="middle">quarantine_positions</text>
  <text class="s" x="845" y="204" text-anchor="middle">rejection_reasons[]</text>
  <rect class="box silver" x="770" y="245" width="150" height="48"/>
  <text class="t" x="845" y="267" text-anchor="middle">silver_aircraft</text>
  <text class="s" x="845" y="284" text-anchor="middle">SCD Type 2</text>
  <rect class="box silver" x="770" y="380" width="150" height="48"/>
  <text class="t" x="845" y="409" text-anchor="middle">silver_airports</text>

  <!-- Job zone -->
  <rect class="zone" x="980" y="70" width="390" height="380"/>
  <text class="z" x="995" y="92">LAKEFLOW JOB · every 30 min</text>
  <rect class="box gold" x="995" y="110" width="360" height="150"/>
  <text class="h" x="1175" y="135" text-anchor="middle">Gold · star schema</text>
  <text class="t" x="1175" y="160" text-anchor="middle">fact_positions — incremental via Change Data Feed</text>
  <text class="t" x="1175" y="182" text-anchor="middle">dim_aircraft (per-version key) · dim_airport</text>
  <text class="t" x="1175" y="204" text-anchor="middle">dim_date · dim_time · sentinel −1 for unknown</text>
  <text class="t" x="1175" y="230" text-anchor="middle">current_positions · agg_hourly · agg_operator · agg_kpi</text>
  <rect class="box" x="995" y="290" width="360" height="90"/>
  <text class="h" x="1175" y="315" text-anchor="middle">Governance task</text>
  <text class="t" x="1175" y="338" text-anchor="middle">RLS: operator_filter ← operator_access table</text>
  <text class="t" x="1175" y="360" text-anchor="middle">CLS: mask_identifier on icao24, registration</text>

  <!-- Consumers -->
  <rect class="box" x="995" y="490" width="170" height="60"/>
  <text class="h" x="1080" y="515" text-anchor="middle">AI/BI Dashboard</text>
  <text class="s" x="1080" y="535" text-anchor="middle">live map · KPIs · filters</text>
  <rect class="box" x="1185" y="490" width="170" height="60"/>
  <text class="h" x="1270" y="515" text-anchor="middle">Genie space</text>
  <text class="s" x="1270" y="535" text-anchor="middle">natural-language Q&amp;A</text>

  <!-- CI/CD zone -->
  <rect class="zone" x="30" y="600" width="1340" height="130"/>
  <text class="z" x="45" y="622">GITHUB ACTIONS · DEV (Free Edition) → PROD (Azure) · nothing built by hand in prod</text>
  <rect class="box" x="60" y="640" width="200" height="60"/>
  <text class="h" x="160" y="665" text-anchor="middle">git push → main</text>
  <text class="s" x="160" y="685" text-anchor="middle">branches · PRs</text>
  <rect class="box" x="330" y="640" width="200" height="60"/>
  <text class="h" x="430" y="665" text-anchor="middle">pytest + chispa</text>
  <text class="s" x="430" y="685" text-anchor="middle">7 unit + data-quality tests</text>
  <rect class="box" x="600" y="640" width="200" height="60"/>
  <text class="h" x="700" y="665" text-anchor="middle">bundle validate</text>
  <text class="s" x="700" y="685" text-anchor="middle">databricks.yml · targets</text>
  <rect class="box" x="870" y="640" width="200" height="60"/>
  <text class="h" x="970" y="665" text-anchor="middle">bundle deploy → prod</text>
  <text class="s" x="970" y="685" text-anchor="middle">pipeline · job · policies</text>
  <rect class="box" x="1140" y="640" width="200" height="60"/>
  <text class="h" x="1240" y="665" text-anchor="middle">Unity Catalog</text>
  <text class="s" x="1240" y="685" text-anchor="middle">catalog · schema · volume · policies</text>

  <!-- Arrows: sources -->
  <path class="line" d="M245,135 L315,135"/>
  <path class="line" d="M245,220 C280,220 280,425 315,425"/>
  <path class="line" d="M245,305 C285,305 285,425 315,425"/>
  <!-- producer -->
  <path class="line" d="M400,165 L400,235"/>
  <text class="s" x="408" y="200">prod</text>
  <path class="line" d="M485,120 C520,120 520,415 555,415"/>
  <path class="dash" d="M485,135 C520,135 520,134 555,134" stroke-dasharray="0"/>
  <text class="s" x="492" y="112">dev: JSON files</text>
  <!-- hub / KV / volume -> bronze -->
  <path class="line" d="M485,262 C520,262 520,140 555,140"/>
  <path class="dash" d="M485,330 C520,330 520,148 555,148"/>
  <text class="s" x="498" y="352">secret scope</text>
  <path class="line" d="M485,425 C520,425 520,269 555,269"/>
  <path class="line" d="M485,432 C525,432 525,404 555,404"/>
  <!-- bronze -> silver -->
  <path class="line" d="M705,130 L770,122"/>
  <path class="line" d="M705,140 L770,187"/>
  <path class="line" d="M705,269 L770,269"/>
  <path class="line" d="M705,404 L770,404"/>
  <!-- silver -> gold -->
  <path class="line" d="M920,124 C960,124 960,160 995,160"/>
  <path class="line" d="M920,269 C960,269 960,185 995,185"/>
  <path class="line" d="M920,404 C960,404 960,210 995,210"/>
  <!-- gold -> gov -> consumers -->
  <path class="line" d="M1175,260 L1175,290"/>
  <path class="line" d="M1080,380 L1080,490"/>
  <path class="line" d="M1270,380 L1270,490"/>
  <!-- CI chain -->
  <path class="line" d="M260,670 L330,670"/>
  <path class="line" d="M530,670 L600,670"/>
  <path class="line" d="M800,670 L870,670"/>
  <path class="dash" d="M970,640 C970,560 740,560 740,450"/>
  <path class="dash" d="M1000,640 C1000,580 1175,580 1175,450"/>
  <text class="s" x="760" y="575">deploys</text>
</svg>
